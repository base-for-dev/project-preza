[project]
name = "preza-server"
version = "1.0.0"
description = "Orchestrates the pipeline (parser -> design_system -> generator -> layout -> audit -> export) behind an API. No pipeline logic lives here directly."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "preza-parser",
    "preza-design-system",
    "preza-generator",
    "preza-layout",
    "preza-audit",
    "preza-export",
    "preza-ir-schema",
    "preza-images",
    "preza-ingest",
    "preza-brand",
    "boto3>=1.43.104",
]

[project.scripts]
preza = "server.cli:main"

[tool.uv.sources]
preza-parser = { workspace = true }
preza-design-system = { workspace = true }
preza-generator = { workspace = true }
preza-layout = { workspace = true }
preza-audit = { workspace = true }
preza-export = { workspace = true }
preza-ir-schema = { workspace = true }
preza-images = { workspace = true }
preza-ingest = { workspace = true }
preza-brand = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]
