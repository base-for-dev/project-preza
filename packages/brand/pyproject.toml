[project]
name = "preza-brand"
version = "0.1.0"
description = "Brand content pack (templates, brand docs, logos, fonts) -> a reusable BrandContext, built ahead of any generation request."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "preza-ingest",
    "preza-inference",
    "preza-parser",
    "preza-design-system",
]

[tool.uv.sources]
preza-ingest = { workspace = true }
preza-inference = { workspace = true }
preza-parser = { workspace = true }
preza-design-system = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brand"]
