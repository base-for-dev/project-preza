[project]
name = "preza-export"
version = "0.1.0"
description = "Deck IR -> .pptx / .html / .pdf with native, editable objects."
requires-python = ">=3.12"
dependencies = [
    "python-pptx>=1.0.2",
    "pydantic>=2.9",
    "pypdfium2>=4.30",
    "pillow>=10",
    "preza-ir-schema",
    "fonttools>=4.50",
    "lxml>=5",
]

[tool.uv.sources]
preza-ir-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/export"]
