[project]
name = "preza-design-system"
version = "0.1.0"
description = "IR -> design tokens: palette, type scale, grid, layout patterns."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "preza-ir-schema"]

[tool.uv.sources]
preza-ir-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/design_system"]
