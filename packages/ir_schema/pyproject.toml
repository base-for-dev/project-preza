[project]
name = "preza-ir-schema"
version = "0.1.0"
description = "Shared JSON Schema for the pipeline's intermediate representation."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ir_schema"]
