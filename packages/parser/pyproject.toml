[project]
name = "preza-parser"
version = "0.1.0"
description = "PPTX/OOXML -> intermediate representation (IR)."
requires-python = ">=3.12"
dependencies = ["python-pptx>=1.0.2", "pydantic>=2.9", "preza-ir-schema"]

[tool.uv.sources]
preza-ir-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parser"]
