[project]
name = "preza-layout"
version = "0.1.0"
description = "Content + tokens -> composed slide IR (pattern matching, fit, 3-variant axis)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "preza-ir-schema", "preza-generator"]

[tool.uv.sources]
preza-ir-schema = { workspace = true }
preza-generator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layout"]
