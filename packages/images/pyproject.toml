[project]
name = "preza-images"
version = "0.1.0"
description = "Unsplash search -> real photo bytes for a slide's image_brief."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6", "httpx>=0.27", "preza-ir-schema", "preza-generator"]

[tool.uv.sources]
preza-ir-schema = { workspace = true }
preza-generator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/images"]
