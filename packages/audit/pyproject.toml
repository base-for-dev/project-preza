[project]
name = "preza-audit"
version = "0.1.0"
description = "Deterministic + model-graded checks on generated deck IR."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]
