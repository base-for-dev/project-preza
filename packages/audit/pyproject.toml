[project]
name = "preza-audit"
version = "0.1.0"
description = "Deterministic + model-graded checks on generated deck IR."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "preza-ir-schema", "preza-design-system"]

[tool.uv.sources]
preza-ir-schema = { workspace = true }
preza-design-system = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]
