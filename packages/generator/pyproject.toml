[project]
name = "preza-generator"
version = "0.1.0"
description = "Brief -> outline -> per-slide content, via skills/ prompts."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "httpx>=0.27", "pyyaml>=6.0", "preza-inference", "preza-design-system"]

[tool.uv.sources]
preza-inference = { workspace = true }
preza-design-system = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator"]
