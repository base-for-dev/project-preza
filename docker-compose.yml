# The whole product from one file:  docker compose up --build
# Open http://localhost:3000. Settings come from .env (copy .env.example first).
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Templates, brand packs and uploads survive a restart.
      - preza-data:/app/data
      - ./evals/templates:/app/evals/templates
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # The address the *browser* uses to reach the API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  preza-data:
